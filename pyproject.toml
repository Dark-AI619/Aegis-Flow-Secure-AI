[project]
name = "aegis-flow-secure-ai"
version = "1.0.0"
description = "A bounded two-agent CrewAI SOAR hackathon demonstration"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
